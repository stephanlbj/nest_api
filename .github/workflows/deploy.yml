name: Deploy NestJS App to ECS

on:
  push:
    branches:
      - main
      - staging
      - preprod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible (staging | preprod | prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preprod
          - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout app code
      - name: Checkout app code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build project
      - name: Build project
        run: npm run build

      # 5️⃣ Configure AWS credentials via IAM secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 7️⃣ Build, tag, push Docker image + Deploy ECS
      - name: Build, tag, push Docker image + Deploy ECS
        run: |
          set -euo pipefail

          ENV="${{ github.event.inputs.environment }}"
          IMAGE_TAG=$(git rev-parse --short HEAD || echo "latest")
          ENV_TAG="${ENV}-latest"

          # URL ECR en dur pour test
          REPO="585665041354.dkr.ecr.eu-north-1.amazonaws.com/nest-api-staging-repo"
          CLUSTER="nest-api-cluster"       # Remplace par ton cluster ECS
          SERVICE="nest-api-service"       # Remplace par ton service ECS
          TASK_IMAGE=""                    # Laisse vide pour utiliser l'image qu'on push

          echo "🐳 Building Docker image..."
          docker build -t "${REPO}:${IMAGE_TAG}" .
          docker tag "${REPO}:${IMAGE_TAG}" "${REPO}:${ENV_TAG}"

          echo "📤 Pushing Docker image to ECR..."
          docker push "${REPO}:${IMAGE_TAG}"
          docker push "${REPO}:${ENV_TAG}"

          # Déploiement ECS
          DEPLOY_IMAGE="${TASK_IMAGE:-${REPO}:${ENV_TAG}}"
          echo "🚀 Updating ECS service $SERVICE in cluster $CLUSTER with image $DEPLOY_IMAGE"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
