name: Deploy NestJS App to ECS

on:
  push:
    branches:
      - main
      - staging
      - preprod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible (staging | preprod | prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preprod
          - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout app code
      - name: Checkout app code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build project
      - name: Build project
        run: npm run build

      # 5️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7️⃣ Checkout Terraform repo
      - name: Checkout Terraform repo
        uses: actions/checkout@v4
        with:
          repository: stephanlbj/terraformdeploy1
          path: terraform

      # 8️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.6

      # 9️⃣ Set environment
      - name: Set environment
        id: env-vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            case "${GITHUB_REF}" in
              "refs/heads/staging") ENV="staging" ;;
              "refs/heads/preprod") ENV="preprod" ;;
              "refs/heads/main") ENV="prod" ;;
              *) ENV="staging" ;;
            esac
          fi
          echo "ENV=$ENV" >> $GITHUB_ENV

      # 🔟 Terraform init & apply
      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve -var-file="envs/${{ env.ENV }}.tfvars"

      # 1️⃣1️⃣ Get Terraform outputs
      - name: Get Terraform outputs
        working-directory: terraform
        run: |
          echo "ECR_REPO=$(terraform output -raw ecr_url)" >> $GITHUB_ENV
          echo "CLUSTER_NAME=$(terraform output -raw ecs_cluster_id)" >> $GITHUB_ENV
          echo "SERVICE_NAME=$(terraform output -raw ecs_service_name)" >> $GITHUB_ENV
          echo "TASK_DEF_IMAGE=$(terraform output -raw ecs_task_image)" >> $GITHUB_ENV

      # 1️⃣2️⃣ Build, tag, and push Docker image
      - name: Build, tag, and push image to ECR
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          ENV_TAG="${ENV}-latest"
          echo "🐳 Building Docker image for $ENV..."
          docker build -t $ECR_REPO:$IMAGE_TAG .
          docker tag $ECR_REPO:$IMAGE_TAG $ECR_REPO:$ENV_TAG
          echo "📤 Pushing to ECR..."
          docker push $ECR_REPO:$IMAGE_TAG
          docker push $ECR_REPO:$ENV_TAG

      # 1️⃣3️⃣ Deploy ECS service
      - name: Deploy to ECS
        run: |
          # Utilise l'image existante de la task definition ou le nouvel image buildé
          TASK_IMAGE="${TASK_DEF_IMAGE:-$ECR_REPO:$ENV_TAG}"
          echo "🚀 Updating ECS service $SERVICE_NAME in cluster $CLUSTER_NAME with image $TASK_IMAGE"
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
