name: Deploy NestJS App to ECS

on:
  push:
    branches:
      - main
      - staging
      - preprod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible (staging | preprod | prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preprod
          - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout app code
      - name: Checkout app code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build project
      - name: Build project
        run: npm run build

      # 5️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 7️⃣ Checkout Terraform repo (same branch as app)
      - name: Checkout Terraform repo
        uses: actions/checkout@v4
        with:
          repository: stephanlbj/terraformdeploy1
          path: terraform
          ref: ${{ github.ref_name }}

      # 8️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      # 9️⃣ Terraform apply + outputs
      - name: Terraform apply and get outputs
        id: terraform-outputs
        working-directory: terraform
        run: |
          set -euo pipefail

          # Déterminer l'environnement
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            case "${GITHUB_REF_NAME}" in
              "staging") ENV="staging" ;;
              "preprod") ENV="preprod" ;;
              "main") ENV="prod" ;;
              *) ENV="staging" ;;
            esac
          fi
          echo "ENV=${ENV}" >> $GITHUB_ENV

          # Terraform init & apply
          terraform init -backend-config="env/backend.${ENV}.tfvars"
          terraform apply -auto-approve -var-file="env/${ENV}.tfvars"

          # Récupération propre des outputs Terraform
          # Supprime retours chariot, espaces et autres caractères invisibles
          ECR_REPO=$(terraform output -raw repository_url | tr -d '\r\n ' | xargs)
          CLUSTER_NAME=$(terraform output -raw ecs_cluster_id | tr -d '\r\n ' | xargs)
          SERVICE_NAME=$(terraform output -raw ecs_service_name | tr -d '\r\n ' | xargs)
          TASK_DEF_IMAGE=$(terraform output -raw ecs_task_image | tr -d '\r\n ' | xargs)

          # Vérifier que les outputs sont valides
          if [ -z "$ECR_REPO" ] || [ -z "$CLUSTER_NAME" ] || [ -z "$SERVICE_NAME" ]; then
            echo "❌ Terraform outputs are empty. Aborting."
            exit 1
          fi

          # Export vers GitHub Actions
          echo "ECR_REPO=${ECR_REPO}" >> $GITHUB_ENV
          echo "CLUSTER_NAME=${CLUSTER_NAME}" >> $GITHUB_ENV
          echo "SERVICE_NAME=${SERVICE_NAME}" >> $GITHUB_ENV
          echo "TASK_DEF_IMAGE=${TASK_DEF_IMAGE}" >> $GITHUB_ENV

          echo "✅ Terraform outputs successfully retrieved."

      # 🔟 Build, tag, and push Docker image + Deploy ECS
      - name: Build, tag, and push Docker image + Deploy ECS
        working-directory: .
        run: |
          set -euo pipefail

          IMAGE_TAG=$(git rev-parse --short HEAD)
          ENV_TAG="${{ env.ENV }}-latest"
          ECR_REPO="${{ env.ECR_REPO }}"
          CLUSTER_NAME="${{ env.CLUSTER_NAME }}"
          SERVICE_NAME="${{ env.SERVICE_NAME }}"
          TASK_DEF_IMAGE="${{ env.TASK_DEF_IMAGE }}"

          echo "🐳 Building Docker image for ${{ env.ENV }}..."
          docker build -t "${ECR_REPO}:${IMAGE_TAG}" .
          docker tag "${ECR_REPO}:${IMAGE_TAG}" "${ECR_REPO}:${ENV_TAG}"
          echo "📤 Pushing to ECR..."
          docker push "${ECR_REPO}:${IMAGE_TAG}"
          docker push "${ECR_REPO}:${ENV_TAG}"

          # Deploy ECS service
          TASK_IMAGE="${TASK_DEF_IMAGE:-$ECR_REPO:$ENV_TAG}"
          echo "🚀 Updating ECS service $SERVICE_NAME in cluster $CLUSTER_NAME with image $TASK_IMAGE"
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
