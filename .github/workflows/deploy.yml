name: Deploy NestJS App to ECS

on:
  push:
    branches:
      - main
      - staging
      - preprod
  workflow_dispatch: # ✅ déclenchement manuel
    inputs:
      environment:
        description: 'Environnement cible (staging | preprod | prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preprod
          - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set environment variables
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            if [[ "${GITHUB_REF}" == "refs/heads/staging" ]]; then
              ENV="staging"
            elif [[ "${GITHUB_REF}" == "refs/heads/preprod" ]]; then
              ENV="preprod"
            elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              ENV="prod"
            fi
          fi

          echo "ENV=$ENV" >> $GITHUB_ENV

          if [[ "$ENV" == "staging" ]]; then
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE_STAGING }}" >> $GITHUB_ENV
            echo "ECR_REPO=myprojet/nest_api_staging" >> $GITHUB_ENV
          elif [[ "$ENV" == "preprod" ]]; then
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE_PREPROD }}" >> $GITHUB_ENV
            echo "ECR_REPO=myprojet/nest_api_preprod" >> $GITHUB_ENV
          elif [[ "$ENV" == "prod" ]]; then
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE_PROD }}" >> $GITHUB_ENV
            echo "ECR_REPO=myprojet/nest_api_prod" >> $GITHUB_ENV
          fi

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO || \
          aws ecr create-repository --repository-name $ECR_REPO

      - name: Build, tag, and push image to ECR
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)

          echo "🐳 Building Docker image for $ENV..."
          docker build -t $ECR_REPO:$IMAGE_TAG .

          echo "🏷️ Tagging for ECR..."
          docker tag $ECR_REPO:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
          docker tag $ECR_REPO:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:latest

          echo "📤 Pushing to ECR..."
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:latest

