name: Deploy NestJS App to ECS

on:
  push:
    branches:
      - main
      - staging
      - preprod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible (staging | preprod | prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preprod
          - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout app code
      - name: Checkout app code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build project
      - name: Build project
        run: npm run build

      # 5️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 7️⃣ Checkout Terraform repo
      - name: Checkout Terraform repo
        uses: actions/checkout@v4
        with:
          repository: stephanlbj/terraformdeploy1
          path: terraform

      # 8️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      # 9️⃣ Set environment
      - name: Set environment
        id: env-vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            case "${GITHUB_REF}" in
              "refs/heads/staging") ENV="staging" ;;
              "refs/heads/preprod") ENV="preprod" ;;
              "refs/heads/main") ENV="prod" ;;
              *) ENV="staging" ;;
            esac
          fi
          echo "ENV=$ENV" >> $GITHUB_ENV

      # 🔟 Terraform init & apply
      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform init -backend-config="env/backend.${{ env.ENV }}.tfvars"
          terraform apply -auto-approve -var-file="env/${{ env.ENV }}.tfvars"

      # 1️⃣1️⃣ Get Terraform outputs safely
      - name: Get Terraform outputs
        working-directory: terraform
        run: |
          set -e

          # Correct outputs for ECR and ECS
          ECR_REPO=$(terraform output -raw repository_url 2>/dev/null || echo "")
          CLUSTER_NAME=$(terraform output -raw ecs_cluster_id 2>/dev/null || echo "")
          SERVICE_NAME=$(terraform output -raw ecs_service_name 2>/dev/null || echo "")
          TASK_DEF_IMAGE=$(terraform output -raw ecs_task_image 2>/dev/null || echo "")

          if [ -z "$ECR_REPO" ] || [ -z "$CLUSTER_NAME" ] || [ -z "$SERVICE_NAME" ]; then
            echo "❌ Terraform outputs are empty. Aborting."
            exit 1
          fi

          # Clean newlines / special characters
          ECR_REPO="${ECR_REPO//$'\n'/}"
          CLUSTER_NAME="${CLUSTER_NAME//$'\n'/}"
          SERVICE_NAME="${SERVICE_NAME//$'\n'/}"
          TASK_DEF_IMAGE="${TASK_DEF_IMAGE//$'\n'/}"

          # Export to GitHub Actions environment
          echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
          echo "TASK_DEF_IMAGE=$TASK_DEF_IMAGE" >> $GITHUB_ENV

          echo "✅ Terraform outputs successfully set in environment variables."

      # 1️⃣2️⃣ Build, tag, and push Docker image
      - name: Build, tag, and push image to ECR
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          ENV_TAG="${ENV}-latest"
          echo "🐳 Building Docker image for $ENV..."
          docker build -t "$ECR_REPO:$IMAGE_TAG" .
          docker tag "$ECR_REPO:$IMAGE_TAG" "$ECR_REPO:$ENV_TAG"
          echo "📤 Pushing to ECR..."
          docker push "$ECR_REPO:$IMAGE_TAG"
          docker push "$ECR_REPO:$ENV_TAG"

      # 1️⃣3️⃣ Deploy ECS service with  new image
      - name: Deploy to ECS
        run: |
          TASK_IMAGE="${TASK_DEF_IMAGE:-$ECR_REPO:$ENV_TAG}"
          echo "🚀 Updating ECS service $SERVICE_NAME in cluster $CLUSTER_NAME with image $TASK_IMAGE"
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
